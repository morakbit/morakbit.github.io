<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORAKBIT STUDIO</title>
<style>
:root { --bg:#ffffff; --fg:#1d1f24; --muted:#5d6370; --line:#e3e5ea; --accent:#2f6fde; --card:#f5f6f8; }
@media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#e8eaee; --muted:#9aa1ad; --line:#2a2e35; --accent:#7aa7ff; --card:#1c1f24; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:24px; }
header a.home { color:var(--muted); text-decoration:none; font-weight:600; letter-spacing:.04em; font-size:14px; }
nav a { color:var(--accent); text-decoration:none; margin-left:12px; font-size:14px; }
h1 { font-size: 26px; line-height:1.35; margin: 8px 0 20px; }
h2 { font-size: 17px; margin: 28px 0 6px; }
p, ul { margin: 0 0 12px; }
ul { padding-left: 22px; }
a { color: var(--accent); word-break: break-all; }
section + section { border-top:1px solid var(--line); margin-top:48px; padding-top:24px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:12px 0; }
.card h2 { margin-top:0; }
footer { color:var(--muted); font-size:13px; margin-top:48px; }
</style>
</head>
<body>
<main>
<header><span class="home">MORAKBIT STUDIO</span></header>
<h1>MORAKBIT STUDIO</h1>
<p>모바일 퍼즐 게임을 만듭니다. · We make mobile puzzle games.</p>
<div class="card"><h2>TURNLINE</h2>
<p><a href="turnline/privacy/">개인정보처리방침</a> · <a href="turnline/privacy/#en">Privacy Policy</a></p></div>
<p>문의 · Contact: <a href="mailto:eunyu.family0@gmail.com">eunyu.family0@gmail.com</a></p>
<footer>© MORAKBIT STUDIO</footer>
</main>
</body>
</html>
